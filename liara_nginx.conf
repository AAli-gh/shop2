# nginx of the Liara Django platform. Default upload limit is 1 MB, which is too small for
# review photos (3 MB) and the admin product import (5 MB sheet + 25 MB ZIP of photos).
client_max_body_size 32M;

location /media {
    alias /usr/src/app/media;
    add_header X-Content-Type-Options nosniff;
}

location /static {
    alias /usr/src/app/staticfiles;
    expires 30d;
    add_header Cache-Control "public";
}

location / {
    try_files /dev/null @django_app;
}

# the database file never ships to Liara, but make sure it could never be served either
location ~\.sqlite3$ {
    deny all;
    error_page 403 =404 /;
}

location ~ /\.well-known {
    allow all;
}

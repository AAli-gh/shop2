{% extends "base.html" %}
{% block title %}گذرواژه تنظیم شد | {{ site_settings.store_name }}{% endblock %}

{% block content %}
<div class="card mx-auto max-w-lg p-8 text-center sm:p-10">
    <div class="icon-tile bg-green-50 text-green-600 dark:bg-ember dark:text-green-300">{% include "partials/icon.html" with name="check" cls="w-8 h-8" sw="2.2" %}</div>
    <h1 class="mt-5 text-xl font-bold">گذرواژه جدید ذخیره شد</h1>
    <p class="mt-2 text-sm text-gray-500 dark:text-mist-dim">اکنون می‌توانید با گذرواژه جدید وارد شوید.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-7">ورود</a>
</div>
{% endblock %}

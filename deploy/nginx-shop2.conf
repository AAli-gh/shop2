# /etc/nginx/sites-available/shop2
# Replace every shop.example.com with your domain before enabling (deploy/README.md, step 8).

upstream shop2_app {
    server unix:/run/shop2/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com www.shop.example.com;

    location / {
        return 301 https://shop.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx older than 1.25.1: remove this line and use "listen 443 ssl http2;" instead
    http2 on;
    server_name shop.example.com www.shop.example.com;

    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # one canonical host: www -> apex
    if ($host = www.shop.example.com) {
        return 301 https://shop.example.com$request_uri;
    }

    # review photos (3 MB) and admin product import (5 MB sheet + 25 MB ZIP of photos)
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /srv/shop2/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /media/ {
        alias /srv/shop2/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://shop2_app;
        proxy_set_header Host $host;
        # Django trusts these two: HTTPS detection (SECURE_PROXY_SSL_HEADER) and rate-limit client IP
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
